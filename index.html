<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>OmniCard OS - Smart Business vCard & Vendor Operating System</title>
  <meta name="description" content="Next-Generation Smart Business vCards with Integrated E-Commerce, Service Quote Builders, Calendar Booking & Review Engine." />
  <meta name="theme-color" content="#07090E" />

  <!-- PWA & Mobile Web App Meta -->
  <link rel="manifest" id="app-manifest-link" href="manifest.webmanifest" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="OmniCard" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="application-name" content="OmniCard" />
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png" />
  <link rel="icon" type="image/svg+xml" href="assets/icons/icon.svg" />
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />

  <script>
    // Early PWA Install Prompt Capture: Capture beforeinstallprompt at millisecond 0
    window.deferredPWAPrompt = null;
    window.addEventListener("beforeinstallprompt", function(e) {
      e.preventDefault();
      window.deferredPWAPrompt = e;
      console.log("⚡ [OmniCard PWA] Early beforeinstallprompt event captured.");
      window.dispatchEvent(new CustomEvent("pwa-prompt-ready", { detail: e }));
    });

    // Save active vendor slug for standalone app launches
    (function() {
      try {
        var params = new URLSearchParams(window.location.search);
        var vSlug = params.get("v");
        if (vSlug) {
          localStorage.setItem("omnicard_last_active_vcard", vSlug);
        }
      } catch (e) {}

      // Promptly refresh service worker if older version is waiting
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          for (var reg of regs) {
            reg.update().catch(function() {});
          }
        }).catch(function() {});
      }
    })();
  </script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/themes.css" />
  <link rel="stylesheet" href="css/style.css" />

  <!-- Firebase Compat SDK (Optional cloud sync) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body data-theme="Sunset Dark">

  <!-- Top System Utility Navigation Bar (Shown exclusively on Public Showcase) -->
  <header class="omni-topbar" id="app-topbar" style="display: none;">
    <div class="brand-badge" id="brand-home-trigger" title="OmniCard OS">
      <div class="badge-icon">⚡</div>
      <span id="topbar-title">OmniCard OS</span>
    </div>

    <div class="topbar-actions">
      <!-- Platform Home / Packages Link -->
      <button class="btn-pill active" id="btn-portal-home" title="View Packages & Features">
        <span>🏠 Packages</span>
      </button>

      <!-- Live Demo vCard Button -->
      <a href="?v=elite-catering" class="btn-pill" id="btn-portal-demo" title="Try Interactive Live Demo vCard">
        <span>👁️ Live Demo vCard</span>
      </a>

      <!-- Super Admin Access Button -->
      <button class="btn-pill" id="btn-portal-admin" title="Super Admin Portal">
        <span>🛡️ Admin Portal</span>
      </button>

      <!-- PWA Install Prompt Button (Visible on both Phone & Laptop) -->
      <button class="btn-pill active" id="btn-pwa-install" data-action="pwa-install" title="Install Web App to Home Screen">
        <span>⬇ Install App</span>
      </button>
    </div>
  </header>

  <!-- Main Stage Canvas -->
  <main class="stage-container" id="main-stage">
    <!-- Clean App Container -->
    <div class="device-shell" id="app-shell">
      <!-- App Content Screen (Scrollable Body) -->
      <div class="device-screen" id="app-content-root">
        <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 60vh; color: var(--theme-primary, #D4FF00); font-family: sans-serif; gap: 14px; text-align: center; padding: 20px;">
          <div style="font-size: 2.2rem; animation: pulse 1.5s infinite;">⚡</div>
          <div style="font-size: 1.1rem; font-weight: 700; color: #FFFFFF; letter-spacing: -0.02em;">OmniCard OS</div>
          <div style="font-size: 0.8rem; color: #94A3B8;">Loading digital business environment...</div>
        </div>
      </div>

      <!-- App Fixed Dock Root (Permanently pinned at bottom of shell) -->
      <div id="app-dock-root"></div>

      <!-- High-z-index Modals Root (Rendered above dock and screen) -->
      <div id="app-modals-root"></div>
    </div>
  </main>

  <!-- Toast Message Container -->
  <div class="toast-container" id="toast-root"></div>

  <!-- Main Application Bootstrap with Cache-Buster -->
  <script type="module" src="js/app.js?v=20260910_v20"></script>
</body>
</html>
